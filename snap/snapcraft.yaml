name: sakdulur
base: core24
version: "0.1.0"
title: "Sakdulur: Family Tree"
summary: Private family tree, built together with your family
description: |
  Sakdulur is a private family tree you build together with your family.

  "Sak dulur" is Javanese for "one family". Map parents, partners and children across generations, add
  photos and stories, and invite relatives to fill in their own branches. It works for a small household
  as well as a whole trah or bani with hundreds of members.

  **A real family tree**

  - Couples side by side, children below their own parents, ancestors and descendants together
  - Remarriages, divorces and engagements, each child under the right couple
  - Birth, adoptive, step, foster, guardian and milk parents, with foster and step links drawn dashed
  - Dates (even "about 1920"), places, photos and notes

  **Build it together**

  - Invite relatives as editors or viewers with a link
  - Share a branch with the people who know it best
  - Copy a branch between your tree, your spouse's and your in-laws'

  **Ask and update by chatting**

  - "Who is Ayu's father?" or "Add Rani as Ayu's daughter, born 1994."
  - Nothing is saved until you press Apply; answers are generated by AI and can be reported

  **Private by default**

  - Every tree is private: only the people you invite can see it
  - No ads, and your data is never sold
  - Export as a picture, Excel or GEDCOM, or delete your account anytime

  In English or Bahasa Indonesia, light or dark. Free. Needs an internet connection to sign in and
  make changes; trees you've opened can also be viewed offline.
website: https://sakdulur.com
contact: https://sakdulur.com
license: Proprietary
grade: stable
confinement: strict
icon: apps/native/src-tauri/icons/icon.png

apps:
  sakdulur:
    command: usr/bin/sakdulur
    extensions:
      - gnome
    desktop: usr/share/applications/sakdulur.desktop
    plugs:
      - browser-support
      - home
      - network
      # Without it the desktop portal refuses the proxy lookup, so WebKit drops every HTTPS request
      # (the hosted app never loads) and navigator.onLine stays false (as found in Malanghub).
      - network-status
      - opengl
      - wayland
      - x11

parts:
  sakdulur:
    plugin: nil
    source: .
    build-snaps:
      - node/24/stable
    build-packages:
      - build-essential
      - curl
      - file
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - patchelf
      - pkg-config
    stage-packages:
      - libwebkit2gtk-4.1-0
    override-build: |
      set -eu
      # Rust from rustup.rs, not the rustup snap: the gnome extension puts the SDK's libc on
      # LD_LIBRARY_PATH, which crashes the snap's bundled loader (as found in Malanghub).
      export RUSTUP_HOME="$SNAPCRAFT_PART_BUILD/.rustup"
      export CARGO_HOME="$SNAPCRAFT_PART_BUILD/.cargo"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      export PATH="$CARGO_HOME/bin:$PATH"
      # The Node snap has no corepack, so install pnpm locally.
      npm install --prefix "$SNAPCRAFT_PART_BUILD/.pnpm" pnpm@10.20.0
      export PATH="$SNAPCRAFT_PART_BUILD/.pnpm/node_modules/.bin:$PATH"
      # The app compiles apps/frontend's screens, so it needs that app's packages too.
      pnpm install --frozen-lockfile --filter native --filter frontend
      pnpm --filter native tauri build --bundles deb --ci

      deb="$(find apps/native/src-tauri/target -path '*/bundle/deb/*.deb' -type f | head -n 1)"
      test -n "$deb"
      dpkg -x "$deb" "$SNAPCRAFT_PART_INSTALL"
      # Snap wants the desktop file named after the app, with an absolute icon path inside the snap.
      apps="$SNAPCRAFT_PART_INSTALL/usr/share/applications"
      mv "$apps/Sakdulur.desktop" "$apps/sakdulur.desktop"
      icon="$(find "$SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor" -path '*/apps/sakdulur.png' | sort -V | tail -n 1)"
      sed -i "s|^Icon=.*|Icon=/${icon#"$SNAPCRAFT_PART_INSTALL/"}|" "$apps/sakdulur.desktop"
      # The app registers no handler inside the snap, so this file's Exec must pass the sign-in deep link on.
      sed -i 's|^Exec=sakdulur$|Exec=sakdulur %u|' "$apps/sakdulur.desktop"
      grep -q '^Exec=sakdulur %u$' "$apps/sakdulur.desktop"
