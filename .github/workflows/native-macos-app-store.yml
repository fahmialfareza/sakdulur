name: Native macOS App Store

# Start with `pnpm release macos <build-number>` (apps/native/RELEASE.md). Uploads to App Store Connect.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (100 = version 1.0.0)."
        required: true
        type: string
      version:
        description: "Version (default: from the build number, 100 = 1.0.0)."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: native-macos-app-store
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build the Mac App Store package and upload it
    runs-on: macos-26
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      MACOS_BUNDLE_ID: com.fahmialfareza.sakdulur
      # Read by `tauri build` to sign the app (Apple Distribution or 3rd Party Mac Developer Application).
      APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_APP_SIGNING_IDENTITY }}
      # The bundled app (apps/native/.env.example): baked in by its Vite build (tauri's beforeBuildCommand).
      VITE_API_URL: ${{ vars.SAKDULUR_API_URL || 'https://api.sakdulur.com' }}
      VITE_SITE_URL: ${{ vars.SAKDULUR_SITE_URL || 'https://sakdulur.com' }}
      VITE_SENTRY_DSN: ${{ secrets.SENTRY_NATIVE_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_NATIVE_PROJECT: ${{ vars.SENTRY_NATIVE_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter native --filter frontend

      - name: Apply release version
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm --filter native release:version "$BUILD_NUMBER" "$VERSION"

      - name: Import signing certificates and the Mac App Store profile
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$APPLE_KEYCHAIN_PASSWORD"
          test -n "$MACOS_INSTALLER_CERTIFICATE_BASE64"
          test -n "$MACOS_PROVISIONING_PROFILE_BASE64"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k build.keychain \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/installer.p12" -k build.keychain \
            -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain

          # Embedded by tauri.appstore.conf.json.
          profile=apps/native/src-tauri/profiles/sakdulur-mac-app-store.provisionprofile
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/mac-profile.plist"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/mac-profile.plist")"
          test "${app_id#*.}" = "$MACOS_BUNDLE_ID"

      - name: Build the signed app (Apple silicon and Intel)
        run: |
          set -euo pipefail
          pnpm --filter native tauri build --target universal-apple-darwin --bundles app \
            --config src-tauri/tauri.appstore.conf.json --ci
          app="$(find apps/native/src-tauri/target/universal-apple-darwin -path '*/bundle/macos/*.app' -maxdepth 5 -type d | head -n 1)"
          test -n "$app"
          codesign --verify --strict "$app"
          codesign -d --entitlements - --xml "$app" | plutil -p - | grep -q '"com.apple.security.app-sandbox" => true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$BUILD_NUMBER"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Build the signed installer package
        env:
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_INSTALLER_SIGNING_IDENTITY"
          pkg="$RUNNER_TEMP/Sakdulur-$RELEASE_VERSION-$BUILD_NUMBER.pkg"
          xcrun productbuild --component "$APP_PATH" /Applications --sign "$MACOS_INSTALLER_SIGNING_IDENTITY" "$pkg"
          echo "PKG_PATH=$pkg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: sakdulur-macos-pkg-${{ inputs.build_number }}
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_APPLE_ID: ${{ secrets.APP_STORE_CONNECT_APPLE_ID }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_APPLE_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-package "$PKG_PATH" --type macos \
            --apple-id "$APP_STORE_CONNECT_APPLE_ID" --bundle-id "$MACOS_BUNDLE_ID" \
            --bundle-version "$BUILD_NUMBER" --bundle-short-version-string "$RELEASE_VERSION" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
