name: IndexNow

# Asks Bing, Copilot and the other IndexNow engines to recrawl the public pages after they change
# (apps/frontend/scripts/indexnow.mjs). Run it by hand after a frontend deploy that the push trigger missed.
on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/src/app/\\[locale\\]/(marketing)/**"
      - "apps/frontend/src/app/llms.txt/**"
      - "apps/frontend/src/lib/guides.ts"
      - "apps/frontend/src/lib/guides-content.ts"
      - "apps/frontend/src/lib/legal-content.ts"
      - "apps/frontend/src/lib/stores.ts"
      - "apps/frontend/messages/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      # Recrawl only once this commit is live: wait for its run of the Deploy frontend workflow.
      - name: Wait for the deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-frontend.yml --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "No deploy run for $GITHUB_SHA"; exit 1; }
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

      - name: Ping IndexNow
        run: node apps/frontend/scripts/indexnow.mjs
