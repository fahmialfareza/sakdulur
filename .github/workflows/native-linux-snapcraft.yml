name: Native Linux Snapcraft

# Start with `pnpm release linux <build-number>` (apps/native/RELEASE.md). Builds snap/snapcraft.yaml for amd64 and
# arm64 and publishes it to the Snap Store.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Release build number (100 = version 1.0.0)."
        required: true
        type: string
      version:
        description: "Version (default: from the build number, 100 = 1.0.0)."
        required: false
        type: string
      channel:
        description: "Snap Store channel."
        required: true
        default: stable
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable

permissions:
  contents: read

concurrency:
  group: native-linux-snapcraft
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish the snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply release version
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          VERSION: ${{ inputs.version }}
        run: |
          build="$BUILD_NUMBER"
          version="${VERSION:-$((build / 100)).$(((build % 100) / 10)).$((build % 10))}"
          # The app's own version (tauri.conf.json, Cargo.toml), then the snap's.
          node apps/native/scripts/set-release-version.mjs "$build" "$version"
          sed -i "s/^version: .*/version: \"${version}\"/" snap/snapcraft.yaml
          echo "Sakdulur ${version} (build ${build}) for ${{ matrix.arch }}"

      # snapcraft builds in its own environment: hand the bundled app's settings over in apps/native/.env
      # (read by its Vite build; see apps/native/.env.example).
      - name: Write the app's build settings
        env:
          VITE_API_URL: ${{ vars.SAKDULUR_API_URL || 'https://api.sakdulur.com' }}
          VITE_SITE_URL: ${{ vars.SAKDULUR_SITE_URL || 'https://sakdulur.com' }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_NATIVE_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_NATIVE_PROJECT: ${{ vars.SENTRY_NATIVE_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          for k in VITE_API_URL VITE_SITE_URL VITE_SENTRY_DSN SENTRY_ORG SENTRY_NATIVE_PROJECT SENTRY_AUTH_TOKEN; do
            printf '%s=%s\n' "$k" "${!k}"
          done > apps/native/.env

      - name: Build the snap
        id: snapcraft
        uses: canonical/action-build@v1

      - uses: actions/upload-artifact@v4
        with:
          name: sakdulur-snap-${{ matrix.arch }}-${{ inputs.build_number }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      - name: Publish to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$SNAPCRAFT_STORE_CREDENTIALS"
          command -v snapcraft >/dev/null || sudo snap install --classic snapcraft
          snapcraft upload "${{ steps.snapcraft.outputs.snap }}" --release "${{ inputs.channel }}"
