name: Native iOS App Store

# Start with `pnpm release ios <build-number>` (apps/native/RELEASE.md). Uploads to App Store Connect (TestFlight).
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (100 = version 1.0.0)."
        required: true
        type: string
      version:
        description: "Version (default: from the build number, 100 = 1.0.0)."
        required: false
        type: string
      export_method:
        description: "Xcode export method."
        required: true
        default: app-store-connect
        type: choice
        options:
          - app-store-connect
          - release-testing

permissions:
  contents: read

concurrency:
  group: native-ios-app-store
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build the iOS IPA and upload it to App Store Connect
    runs-on: macos-26
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: com.fahmialfareza.sakdulur
      # The bundled app (apps/native/.env.example): baked in by its Vite build (tauri's beforeBuildCommand).
      VITE_API_URL: ${{ vars.SAKDULUR_API_URL || 'https://api.sakdulur.com' }}
      VITE_SITE_URL: ${{ vars.SAKDULUR_SITE_URL || 'https://sakdulur.com' }}
      VITE_SENTRY_DSN: ${{ secrets.SENTRY_NATIVE_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_NATIVE_PROJECT: ${{ vars.SENTRY_NATIVE_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version
          sdk="$(xcodebuild -sdk iphoneos -version SDKVersion)"
          # App Store uploads need the iOS 26 SDK or newer.
          [ "${sdk%%.*}" -ge 26 ] || { echo "iPhoneOS SDK $sdk is too old"; exit 1; }

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter native --filter frontend

      - name: Apply release version
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm --filter native release:version "$BUILD_NUMBER" "$VERSION"

      - name: Check app icons
        run: |
          # App Store rejects app icons with an alpha channel (re-run `pnpm icons` adds one back; see RELEASE.md).
          set -euo pipefail
          for f in apps/native/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/*.png; do
            if sips -g hasAlpha "$f" | grep -q "hasAlpha: yes"; then echo "$f has an alpha channel"; exit 1; fi
          done

      - name: Import signing certificate and App Store profile
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$APPLE_KEYCHAIN_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k build.keychain \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain

          profile="$RUNNER_TEMP/sakdulur-ios.mobileprovision"
          plist="$RUNNER_TEMP/sakdulur-ios-profile.plist"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile"
          security cms -D -i "$profile" > "$plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
          team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist" 2>/dev/null || echo false)"
          test "${app_id#"$team."}" = "$IOS_BUNDLE_ID"
          if [ "$get_task_allow" = "true" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 must be an App Store profile, not a development profile."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          {
            echo "IOS_PROFILE_UUID=$uuid"
            echo "IOS_PROFILE_NAME=$name"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID:-$team}"
          } >> "$GITHUB_ENV"

      - name: Sign with the App Store profile
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          # Tauri runs xcodebuild itself; this wrapper (from Malanghub) forces manual distribution signing on the
          # archive and swaps in our ExportOptions.plist on the export.
          set -euo pipefail
          wrapper_dir="$RUNNER_TEMP/xcodebuild-wrapper"
          mkdir -p "$wrapper_dir"
          export_options="$wrapper_dir/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :method string $EXPORT_METHOD" \
            -c "Add :destination string export" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string Apple Distribution" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            -c "Add :stripSwiftSymbols bool true" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROFILE_NAME" \
            "$export_options"
          cat > "$wrapper_dir/xcodebuild" <<EOF
          #!/bin/bash
          set -euo pipefail
          args=()
          export_archive=0
          skip=0
          for arg in "\$@"; do
            if [ "\$skip" = 1 ]; then skip=0; continue; fi
            case "\$arg" in
              CODE_SIGN_STYLE=*|DEVELOPMENT_TEAM=*|CODE_SIGN_IDENTITY=*|PROVISIONING_PROFILE=*|PROVISIONING_PROFILE_SPECIFIER=*|-allowProvisioningUpdates) ;;
              -exportOptionsPlist) skip=1 ;;
              -exportOptionsPlist=*) ;;
              -exportArchive) export_archive=1; args+=("\$arg") ;;
              *) args+=("\$arg") ;;
            esac
          done
          if [ "\$export_archive" = 1 ]; then
            exec /usr/bin/xcodebuild "\${args[@]}" -exportOptionsPlist "$export_options"
          fi
          exec /usr/bin/xcodebuild "\${args[@]}" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"
          EOF
          chmod +x "$wrapper_dir/xcodebuild"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Build IPA
        run: |
          set -euo pipefail
          pnpm --filter native tauri ios build --target aarch64 --export-method "${{ inputs.export_method }}" --ci
          ipa="$(find apps/native/src-tauri/gen/apple -name '*.ipa' -type f | head -n 1)"
          test -n "$ipa"
          unpacked="$RUNNER_TEMP/ipa"
          rm -rf "$unpacked" && mkdir -p "$unpacked" && unzip -q "$ipa" -d "$unpacked"
          info="$(find "$unpacked/Payload" -path '*.app/Info.plist' -type f | head -n 1)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "$IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$RELEASE_VERSION"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: sakdulur-ios-ipa-${{ inputs.build_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: inputs.export_method == 'app-store-connect'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_APPLE_ID: ${{ secrets.APP_STORE_CONNECT_APPLE_ID }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_APPLE_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-package "$IPA_PATH" --type ios \
            --apple-id "$APP_STORE_CONNECT_APPLE_ID" --bundle-id "$IOS_BUNDLE_ID" \
            --bundle-version "$BUILD_NUMBER" --bundle-short-version-string "$RELEASE_VERSION" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
