name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Type-check
        run: pnpm --filter frontend check-types

      - name: Build
        run: pnpm --filter frontend build

  # The bundled app's screens (apps/native, Vite): apps/frontend's components through shims, so a frontend change
  # can break it too. The Tauri shell itself is built by the release workflows.
  native:
    # Windows too: Vite reports its paths differently there (vite.config.ts overrides).
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter native check-types

      - name: Build
        run: pnpm --filter native build
        env:
          VITE_API_URL: https://api.sakdulur.com

  backend-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-go
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_tree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_tree_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # Newest 1.26 patch, like the golang:1.26-alpine Docker image; the exact go.mod version (1.26.0)
          # carries standard-library vulnerabilities that govulncheck reports.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/backend-go/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "Run gofmt on:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Test (authorization matrix against Postgres + Redis)
        run: go test -count=1 ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Docker build
        run: docker build -f docker/Dockerfile -t family-tree-backend:ci .
